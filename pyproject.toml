[project]
name = "tarl"
version = "0.1.0"
description = "terminal-agent-rl: GRPO on terminal tasks with LLM-judge-shaped rewards"
requires-python = ">=3.12"
dependencies = [
    "transformers==5.5.4",
    "trl>=1.8,<1.9",
    "vllm>=0.22",
    "peft>=0.14",
    "bitsandbytes>=0.45",
    "accelerate>=1.2",
    "datasets>=3.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy",
    "scipy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
